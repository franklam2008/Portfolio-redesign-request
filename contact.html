<body style="margin:0;background:var(--surface-page);">
<div id="root"></div>
<noscript>
  <p style="font-family:monospace;padding:24px;max-width:640px;">Frank Lam — contact. This page needs JavaScript to display. Email: <a href="mailto:franklam2008@gmail.com">franklam2008@gmail.com</a>. <a href="https://github.com/franklam2008">GitHub</a>, <a href="https://www.linkedin.com/in/frank-lam-010a9253">LinkedIn</a>.</p>
</noscript>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="/content.js"></script>
<script type="text/babel" src="/layout.jsx"></script>
<script type="text/babel">
const { Input, Button } = window.FrankLamDesignSystem_07ac32;
const { contactForm, contactLinks } = window.SITE;
const { Page, Eyebrow } = window;

const EMAIL_HREF = contactLinks.find((l) => l.label === 'Email').href; // mailto:...
const EMAIL_ADDRESS = EMAIL_HREF.replace('mailto:', '');
// Until a Formspree endpoint is set in content.js, the form opens the visitor's email app instead.
const USE_FORMSPREE = !/YOUR_FORM_ID/.test(contactForm.formspreeEndpoint);

const note = { fontFamily: 'var(--font-mono)', fontSize: 'var(--text-xs)', margin: 0 };

function ContactSection() {
  const [values, setValues] = React.useState({ name: '', email: '', message: '' });
  const [status, setStatus] = React.useState('idle'); // idle | sending | sent | error | invalid | mailto

  const onChange = (key) => (e) => setValues((v) => ({ ...v, [key]: e.target.value }));
  const onSubmit = async (e) => {
    e.preventDefault();
    const message = values.message.trim();
    const name = values.name.trim();
    const email = values.email.trim();
    if (!message) { setStatus('invalid'); return; }

    if (!USE_FORMSPREE) {
      const subject = encodeURIComponent('Message from ' + (name || 'your portfolio'));
      const body = encodeURIComponent(message + '\n\n' + [name, email && '<' + email + '>'].filter(Boolean).join(' '));
      window.location.href = EMAIL_HREF + '?subject=' + subject + '&body=' + body;
      setStatus('mailto');
      return;
    }

    setStatus('sending');
    try {
      const res = await fetch(contactForm.formspreeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ name, email, message }),
      });
      setStatus(res.ok ? 'sent' : 'error');
    } catch {
      setStatus('error');
    }
  };

  return (
    <section style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: 'var(--space-9) var(--space-6) var(--space-9)' }}>
      <h1 style={{
        fontFamily: 'var(--font-mono)', fontSize: 'var(--text-2xl)', letterSpacing: 'var(--tracking-tight)',
        fontWeight: 'var(--weight-semibold)', color: 'var(--text-primary)', margin: '0 0 var(--space-3)',
      }}>
        {contactForm.heading}
      </h1>
      <p style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--text-md)', color: 'var(--text-secondary)', margin: '0 0 var(--space-7)', maxWidth: 560 }}>
        {contactForm.text}
      </p>

      <div style={{
        border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)',
        padding: 'var(--space-6)', background: 'var(--surface-raised)', maxWidth: 480, marginBottom: 'var(--space-8)',
      }}>
        {status === 'sent' ? (
          <p role="status" style={{ ...note, fontSize: 'var(--text-sm)', color: 'var(--state-success)' }}>
            Sent. Thanks &mdash; I'll get back to you.
          </p>
        ) : (
          <form onSubmit={onSubmit} noValidate style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
            <Input label="Name" placeholder="Your name" value={values.name} onChange={onChange('name')} />
            <Input label="Email" type="email" placeholder="you@example.com" value={values.email} onChange={onChange('email')} />
            <Input label="Message" placeholder="What are you building?" multiline value={values.message} onChange={onChange('message')} />
            <p style={{ ...note, color: 'var(--text-muted)' }}>{contactForm.disclaimer}</p>
            <div aria-live="polite">
              {status === 'invalid' && (
                <p style={{ ...note, color: 'var(--state-danger)' }}>Add a message first.</p>
              )}
              {status === 'error' && (
                <p style={{ ...note, color: 'var(--state-danger)' }}>
                  Something went wrong &mdash; try again, or email me at <a href={EMAIL_HREF}>{EMAIL_ADDRESS}</a>.
                </p>
              )}
              {status === 'mailto' && (
                <p style={{ ...note, color: 'var(--text-secondary)' }}>
                  Opening your email app. If nothing opens, write to <a href={EMAIL_HREF}>{EMAIL_ADDRESS}</a>.
                </p>
              )}
            </div>
            <div>
              <Button variant="primary" type="submit" disabled={status === 'sending'}>
                {status === 'sending' ? 'Sending…' : 'Send'}
              </Button>
            </div>
          </form>
        )}
      </div>

      <div>
        <Eyebrow as="h2">Or reach me directly</Eyebrow>
        <div style={{ display: 'flex', gap: 'var(--space-3)', flexWrap: 'wrap' }}>
          {contactLinks.map((item) => {
            const external = /^https?:/.test(item.href) || item.href.endsWith('.pdf');
            return (
              <Button key={item.label} as="a" href={item.href} target={external ? '_blank' : undefined} rel="noreferrer" variant="secondary" size="sm">
                {item.label}
              </Button>
            );
          })}
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <Page active="contact">
      <ContactSection />
    </Page>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<script type="text/babel">
const { Tag } = window.FrankLamDesignSystem_07ac32;
const { experience, education, skillSections, languageNote, contactLinks } = window.SITE;
const { Page, Eyebrow, Rich } = window;

const wrap = { maxWidth: 'var(--container-max)', margin: '0 auto', padding: '0 var(--space-6)' };

function Job({ job }) {
  return (
    <div className="xp-row">
      <div className="xp-meta">{job.dates}</div>
      <div>
        <h3 className="xp-role">{job.role}</h3>
        <p className="xp-company">{job.company}</p>
        {job.note && <p className="xp-note">{job.note}</p>}
        {job.bullets.length > 0 && (
          <ul className="xp-bullets">
            {job.bullets.map((b, i) => <li key={i}><Rich text={b} /></li>)}
          </ul>
        )}
      </div>
    </div>
  );
}

function App() {
  return (
    <Page active="experience">
      <section style={{ ...wrap, paddingTop: 'var(--space-9)', paddingBottom: 'var(--space-8)' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', flexWrap: 'wrap', gap: 'var(--space-3)', marginBottom: 'var(--space-7)' }}>
          <h1 style={{
            fontFamily: 'var(--font-mono)', fontSize: 'var(--text-2xl)', letterSpacing: 'var(--tracking-tight)',
            fontWeight: 'var(--weight-semibold)', color: 'var(--text-primary)', margin: 0,
          }}>
            Experience.
          </h1>
          <a href={contactLinks[0].href} target="_blank" rel="noreferrer" style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--text-sm)', color: 'var(--accent)', textDecoration: 'none' }}>
            Download resume (PDF) &rarr;
          </a>
        </div>
        <div style={{ borderBottom: '1px solid var(--border-subtle)' }}>
          {experience.map((job) => <Job key={job.company + job.dates} job={job} />)}
        </div>
      </section>

      <section style={{ ...wrap, paddingBottom: 'var(--space-8)' }}>
        <Eyebrow as="h2" style={{ marginBottom: 'var(--space-6)' }}>Skills</Eyebrow>
        {skillSections.map((section) => (
          <div key={section.title} style={{ marginBottom: 'var(--space-6)' }}>
            <h3 style={{
              fontFamily: 'var(--font-mono)', fontSize: 'var(--text-sm)', fontWeight: 'var(--weight-medium)',
              color: 'var(--text-secondary)', margin: '0 0 var(--space-3)',
            }}>
              {section.title}
            </h3>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--space-2)' }}>
              {section.skills.map((s) => <Tag key={s} tone="accent">{s}</Tag>)}
            </div>
          </div>
        ))}
      </section>

      <section style={{ ...wrap, paddingBottom: 'var(--space-9)' }}>
        <Eyebrow as="h2" style={{ marginBottom: 'var(--space-3)' }}>Education</Eyebrow>
        <div>
          {education.map((e) => (
            <div key={e.school} className="edu-row">
              <span><strong>{e.school}</strong> &middot; {e.degree}</span>
              <span style={{ color: 'var(--text-muted)' }}>{e.date}</span>
            </div>
          ))}
        </div>
        <p style={{
          fontFamily: 'var(--font-mono)', fontSize: 'var(--text-sm)', lineHeight: 'var(--leading-normal)',
          color: 'var(--text-secondary)', borderTop: '1px solid var(--border-subtle)', paddingTop: 'var(--space-5)', marginTop: 'var(--space-5)',
        }}>
          {languageNote}
        </p>
      </section>
    </Page>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
